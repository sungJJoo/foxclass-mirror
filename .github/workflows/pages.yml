# 리포 전체를 GitHub Pages로 배포한다.
# 배포 후 접근 경로
#   /                → HTTrack 미러 (루트 index.html이 class.foxconnect.kr/ 로 이동)
#   /wsu-neulbom/    → 우송대학교 WISE 늘봄
#   /fox-ai-lab/     → 폭스러닝센터 AI 연구소
#
# 사용 전 준비: Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 변경
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mokwon-wise-site-clone-9ew9ge
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 한다 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 로드
        uses: actions/configure-pages@v5

      - name: 정적 파일 업로드
        # Jekyll 빌드 없이 리포 내용을 그대로 올린다 (.git, .github 는 자동 제외)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
