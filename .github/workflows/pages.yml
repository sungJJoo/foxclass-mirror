# wsu-neulbom/ 폴더만 GitHub Pages로 배포한다.
# 리포에 함께 있는 HTTrack 미러와 fox-ai-lab 은 배포 대상에서 제외된다.
#
# 사용 전 준비: Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 변경
name: Deploy WISE Neulbom site

on:
  push:
    branches:
      - main
      - claude/mokwon-wise-site-clone-9ew9ge
    paths:
      - 'wsu-neulbom/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 여러 배포가 겹치지 않도록 한다 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정 로드
        uses: actions/configure-pages@v5

      - name: 정적 파일 업로드
        # wsu-neulbom/ 내용을 사이트 루트로 올린다 (Jekyll 빌드 없음)
        uses: actions/upload-pages-artifact@v3
        with:
          path: wsu-neulbom

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
